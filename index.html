<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nossa História - Uma experiência romântica interativa e cinematográfica">
    <title>Nossa História ❤️</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Audio Control -->
    <div class="audio-control">
        <button id="musicToggle" class="music-btn" title="Ativar/Desativar música">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.1v2.7c2.89.86 5 3.54 5 6.8s-2.11 5.94-5 6.8v2.7c4.01-.91 7-4.49 7-9.5s-2.99-8.59-7-9.5z"/>
            </svg>
        </button>
        <audio id="bgMusic" loop>
            <source src="assets/audio/background-music.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Nossa História</p>
        </div>
    </div>

    <!-- Main Container -->
    <div id="mainContainer" class="container hidden">
        <!-- Scene: Opening Cinematic -->
        <section id="openingScene" class="scene active">
            <div class="opening-background">
                <div class="stars"></div>
                <div class="stars-light"></div>
            </div>
            
            <div class="opening-content">
                <div class="opening-text">
                    <h1 class="title-main">Nossa História</h1>
                    <p class="subtitle">Uma experiência romântica cinematográfica</p>
                    <div class="decorative-line"></div>
                </div>
                
                <div class="opening-animation">
                    <div class="heart-pulse"></div>
                    <div class="heart-pulse" style="animation-delay: 0.5s"></div>
                </div>
            </div>
            
            <div class="opening-footer">
                <button id="startBtn" class="btn btn-primary">Começar</button>
                <p class="skip-text">Pressione ESC para pular</p>
            </div>
        </section>

        <!-- Scene: Menu -->
        <section id="mainMenu" class="scene hidden">
            <div class="menu-background"></div>
            
            <div class="menu-content">
                <h1>Nossa História</h1>
                <nav class="menu-nav">
                    <button class="menu-item" onclick="navigateTo('timeline')">
                        <span class="icon">📍</span>
                        <span>Mapa</span>
                    </button>
                    <button class="menu-item" onclick="navigateTo('memories')">
                        <span class="icon">🔍</span>
                        <span>Memórias</span>
                    </button>
                    <button class="menu-item" onclick="navigateTo('vault')">
                        <span class="icon">🔐</span>
                        <span>Cofre</span>
                    </button>
                    <button class="menu-item" onclick="navigateTo('quiz')">
                        <span class="icon">💕</span>
                        <span>Quiz</span>
                    </button>
                    <button class="menu-item" onclick="navigateTo('games')">
                        <span class="icon">🎮</span>
                        <span>Jogos</span>
                    </button>
                    <button class="menu-item" onclick="navigateTo('letter')">
                        <span class="icon">💌</span>
                        <span>Carta</span>
                    </button>
                    <button class="menu-item" onclick="navigateTo('diary')">
                        <span class="icon">📔</span>
                        <span>Diário</span>
                    </button>
                    <button class="menu-item" onclick="navigateTo('gallery')">
                        <span class="icon">🖼️</span>
                        <span>Fotos</span>
                    </button>
                    <button class="menu-item" onclick="navigateTo('timer')">
                        <span class="icon">⏰</span>
                        <span>Contador</span>
                    </button>
                </nav>
            </div>
        </section>

        <!-- Scene: Timeline -->
        <section id="timeline" class="scene hidden">
            <div class="scene-header">
                <h2>Mapa da Nossa História</h2>
                <button class="close-btn" onclick="goToMenu()">✕</button>
            </div>
            <div class="scene-content"><p>Momentos especiais...</p></div>
        </section>

        <!-- Scene: Memories -->
        <section id="memories" class="scene hidden">
            <div class="scene-header">
                <h2>Caça às Memórias</h2>
                <button class="close-btn" onclick="goToMenu()">✕</button>
            </div>
            <div class="scene-content" id="memoriesGrid"></div>
        </section>

        <!-- Scene: Vault -->
        <section id="vault" class="scene hidden">
            <div class="scene-header">
                <h2>Cofre Secreto</h2>
                <button class="close-btn" onclick="goToMenu()">✕</button>
            </div>
            <div class="scene-content">
                <div class="vault-container">
                    <div class="vault-icon">🔐</div>
                    <input type="password" id="vaultPassword" placeholder="Senha" class="vault-input">
                    <button class="btn btn-primary" onclick="checkVaultPassword()">Abrir</button>
                </div>
            </div>
        </section>

        <!-- Scene: Quiz -->
        <section id="quiz" class="scene hidden">
            <div class="scene-header">
                <h2>Quiz Romântico</h2>
                <button class="close-btn" onclick="goToMenu()">✕</button>
            </div>
            <div class="scene-content" id="quizContainer"></div>
        </section>

        <!-- Scene: Games -->
        <section id="games" class="scene hidden">
            <div class="scene-header">
                <h2>Jogos</h2>
                <button class="close-btn" onclick="goToMenu()">✕</button>
            </div>
            <div class="scene-content">
                <div class="games-menu">
                    <button class="game-card" onclick="startGame('memory')">
                        <span>🧩</span> Memória
                    </button>
                    <button class="game-card" onclick="startGame('hearts')">
                        <span>❤️</span> Corações
                    </button>
                </div>
            </div>
        </section>

        <!-- Scene: Letter -->
        <section id="letter" class="scene hidden">
            <div class="scene-header">
                <h2>Carta Romântica</h2>
                <button class="close-btn" onclick="goToMenu()">✕</button>
            </div>
            <div class="scene-content"><div id="letterText" class="letter-text"></div></div>
        </section>

        <!-- Scene: Diary -->
        <section id="diary" class="scene hidden">
            <div class="scene-header">
                <h2>Diário</h2>
                <button class="close-btn" onclick="goToMenu()">✕</button>
            </div>
            <div class="scene-content">
                <textarea id="diaryTextarea" placeholder="Escreva uma memória..."></textarea>
                <button class="btn btn-primary" onclick="saveDiaryEntry()">Salvar</button>
                <div id="diaryEntries"></div>
            </div>
        </section>

        <!-- Scene: Gallery -->
        <section id="gallery" class="scene hidden">
            <div class="scene-header">
                <h2>Fotos</h2>
                <button class="close-btn" onclick="goToMenu()">✕</button>
            </div>
            <div class="scene-content" id="galleryGrid"></div>
        </section>

        <!-- Scene: Timer -->
        <section id="timer" class="scene hidden">
            <div class="scene-header">
                <h2>Contador</h2>
                <button class="close-btn" onclick="goToMenu()">✕</button>
            </div>
            <div class="scene-content">
                <div id="timerDisplay"></div>
            </div>
        </section>
    </div>

    <script src="js/main.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
